<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fatty Family Stickers</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent !important;
    overflow: visible;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    background: transparent !important;
}

#stickerBoard {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: transparent !important;
    pointer-events: none;
}

.display-sticker {
    position: absolute;
    width: 100px;
    height: 100px;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;

    pointer-events: none;

    display: block;
}

</style>
</head>

<body>

<div id="stickerBoard"></div>

<script>

/* =====================================
   CONFIGURATION
===================================== */

const API =
"https://script.google.com/macros/s/AKfycbwmhyUcGkUlcLSu9JJAph3V4eoACp1afq5KaTpcAWKAgK8BqrP1v_MNMySEGgkr0E2suQ/exec";

const board = document.getElementById("stickerBoard");

let STICKER_LIBRARY = [];
let BOARD_STICKERS = [];


/* =====================================
   API REQUEST
===================================== */

function api(action) {

    return new Promise((resolve, reject) => {

        const callbackName =
            "displaySticker_" +
            Date.now() + "_" +
            Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const query = new URLSearchParams({
            action: action,
            callback: callbackName
        });

        script.src = API + "?" + query.toString();

        const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out."));
        }, 20000);

        function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
        }

        window[callbackName] = data => {

            cleanup();

            if (!data || data.success === false) {
                reject(new Error(
                    data?.error || "Unable to load stickers."
                ));
                return;
            }

            resolve(data);

        };

        script.onerror = () => {
            cleanup();
            reject(new Error("Connection failed."));
        };

        document.body.appendChild(script);

    });

}


/* =====================================
   FIND STICKER IMAGE
===================================== */

function findLibrary(name) {

    return STICKER_LIBRARY.find(sticker =>
        sticker.name.toLowerCase() === name.toLowerCase()
    );

}


/* =====================================
   LOAD ALL DATA
===================================== */

async function loadStickers() {

    try {

        // One request loads the board and library.
        const result = await api("getInitialData");

        STICKER_LIBRARY = result.library || [];

        BOARD_STICKERS = [];

        (result.stickers || []).forEach(item => {

            const librarySticker = findLibrary(item.name);

            if (!librarySticker) return;

            (item.placements || []).forEach(placement => {

                BOARD_STICKERS.push({

                    name: item.name,

                    imageUrl: librarySticker.imageUrl,

                    x: Number(placement.x),

                    y: Number(placement.y)

                });

            });

        });

        renderStickers();

    } catch (error) {

        console.error("Sticker loading error:", error);

    }

}


/* =====================================
   DISPLAY STICKERS
===================================== */

function renderStickers() {

    board.innerHTML = "";

    BOARD_STICKERS.forEach(item => {

        const img = document.createElement("img");

        img.className = "display-sticker";

        img.src = item.imageUrl;

        img.alt = item.name;

        img.draggable = false;

        img.decoding = "async";

        img.style.left = item.x + "px";

        img.style.top = item.y + "px";

        board.appendChild(img);

    });

}


/* =====================================
   START
===================================== */

loadStickers();

</script>

</body>
</html>
